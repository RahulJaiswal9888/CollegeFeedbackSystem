<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Give Feedback - FeedbackHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo">🎓 FeedbackHub</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="feedback.html">Give Feedback</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>


    <!-- Feedback Form -->
    <div class="form-container">

        <div class="form-card">

            <h1>Student Feedback</h1>

            <p class="subtitle">
                Share your experience and help us improve.
            </p>


            <form action="FeedbackServlet" method="post">

                <!-- Student Name -->
                <label>Student Name</label>

                <input type="text"
                       name="student_name"
                       placeholder="Enter your name"
                       required>


                <!-- Email -->
                <label>Email</label>

                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>


                <!-- Course & Semester -->
                <div class="row">

                    <div>
                        <label>Course</label>

                        <select name="course" required>

                            <option value="">
                                Select Course
                            </option>

                            <option value="MCA AI/ML">
                                MCA AI/ML
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="B.Tech">
                                B.Tech
                            </option>

                            <option value="MBA">
                                MBA
                            </option>

                        </select>
                    </div>


                    <div>
                        <label>Semester</label>

                        <select name="semester" required>

                            <option value="">
                                Select Semester
                            </option>

                            <option value="1st">1st</option>
                            <option value="2nd">2nd</option>
                            <option value="3rd">3rd</option>
                            <option value="4th">4th</option>
                            <option value="5th">5th</option>
                            <option value="6th">6th</option>

                        </select>
                    </div>

                </div>


                <!-- Faculty -->
                <label>Faculty Name</label>

                <input type="text"
                       name="faculty"
                       placeholder="Enter faculty name"
                       required>


                <!-- Subject -->
                <label>Subject</label>

                <input type="text"
                       name="subject"
                       placeholder="Enter subject name"
                       required>


                <!-- Rating -->
                <label>Overall Rating</label>

                <select name="rating" required>

                    <option value="">
                        Select Rating
                    </option>

                    <option value="5">
                        ★★★★★ - Excellent
                    </option>

                    <option value="4">
                        ★★★★ - Very Good
                    </option>

                    <option value="3">
                        ★★★ - Good
                    </option>

                    <option value="2">
                        ★★ - Average
                    </option>

                    <option value="1">
                        ★ - Poor
                    </option>

                </select>


                <!-- Message -->
                <label>Additional Feedback</label>

                <textarea name="message"
                          rows="5"
                          placeholder="Write your feedback here..."
                          required></textarea>


                <!-- Submit -->
                <button type="submit">
                    Submit Feedback
                </button>

            </form>

        </div>

    </div>

</body>
</html>
